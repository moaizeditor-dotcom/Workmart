# Netlify Production Deployment Configuration for WorkMart
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 1. API Route: Dispatches all /api/* requests to the serverless backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 2. SPA Fallback: routes all frontend page requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
